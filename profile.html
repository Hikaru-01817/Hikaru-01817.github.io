    <body id="profile-page">

                    <li><a href="index.html">Home</a></li>

                    <li><a href="mailto:r202301812fd@jinadai.jp">Contact</a></li>

            </div>

        <!--メインコンテンツ-->
        <main class="container2">
            <div class="blog-head"></div> <!-- 共通のデザインバー -->
            
            <!-- タイトルをカードの外に配置 -->
            <h1 id="profile-title">Profile</h1>

            <!-- プロフィールセクション -->
            <div class="profile-card fadein">
                <!-- 1. プロフィール写真エリア -->
                <div class="profile-photo-area">
                    <img src="images/IMG_3732.jpeg" alt="Hikaru Profile Photo">
                </div>

                <!-- 2. & 3. 名前と詳細情報エリア -->
                <div class="profile-info-area">
                    <h2>Hikaru</h2>
                    <dl class="profile-details">
                        <div class="detail-item">
                            <dt>From</dt>
                            <dd>神奈川、相模原市</dd>
                        </div>
                        <div class="detail-item">
                            <dt>Hobby</dt>
                            <dd>ゲーム（特にポケモン系！！）</dd>
                        </div>
                        <div class="detail-item">
                            <dt>Part-time job</dt>
                            <dd>コンサートスタッフ</dd>
                        </div>
                        <div class="detail-item">
                            <dt>Favorite shop</dt>
                            <dd>タリーズコーヒー</dd>
                        </div>
                        <div class="detail-item">
                            <dt>Favorite food</dt>
                            <dd>生ラムネ</dd>
                        </div>
                    </dl>
                </div>
            </div>

        </main>

        <!--フッター (共通)-->
        <footer>
            <div>
                <ul class="footer-nav">
